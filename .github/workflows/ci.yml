name: CI
on:
  push:
    branches: [master, main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build
        run: go build -o bin/nvs ./cmd/nvs/
      - name: Regression
        run: go run ./cmd/nvs/ run examples/full_regression.ns
